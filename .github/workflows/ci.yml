name: CI

# Runs the README commands on Linux: fetch the gateway at the commit in PIN, run every scenario,
# then plant each known fault and check the scenarios catch it. No secrets are used.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  attack:
    name: scenarios and planted faults (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install harness dependencies
        run: npm ci --include=dev

      - name: Fetch the gateway at the pinned commit
        run: npm run vendor

      - name: Run every scenario
        run: npm run attack

      - name: Plant known faults
        run: python3 scripts/mutate.py
